<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dataminds — Message Sent!</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FFE34D;
    --black:  #111111;
    --red:    #FF3B3B;
    --blue:   #1A1AFF;
    --white:  #FAFAF5;
    --green:  #00C853;
    --stripe: repeating-linear-gradient(
      -45deg,
      var(--yellow) 0px, var(--yellow) 10px,
      var(--black)  10px, var(--black)  20px
    );
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--black);
    font-family: 'Comic Neue', cursive;
    color: var(--white);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    overflow: hidden;
    position: relative;
  }

  /* top & bottom stripe tape */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 18px;
    background: var(--stripe);
    z-index: 10;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 18px;
    background: var(--stripe);
    z-index: 10;
  }

  /* background radial glow */
  .bg-glow {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 40%, #1a1aff18 0%, transparent 55%),
      radial-gradient(ellipse at 70% 60%, #00c85318 0%, transparent 55%);
    pointer-events: none;
  }

  /* floating emojis */
  .floaty {
    position: fixed;
    font-size: 38px;
    opacity: 0.10;
    user-select: none;
    animation: float 6s ease-in-out infinite;
  }
  .floaty:nth-child(1){ top:12%; left:5%;  animation-delay:0s;   }
  .floaty:nth-child(2){ top:65%; left:4%;  animation-delay:1.2s; }
  .floaty:nth-child(3){ top:18%; right:5%; animation-delay:0.6s; }
  .floaty:nth-child(4){ top:70%; right:4%; animation-delay:1.8s; }
  .floaty:nth-child(5){ top:42%; left:12%; animation-delay:0.9s; font-size:26px; }
  .floaty:nth-child(6){ top:38%; right:10%;animation-delay:2.1s; font-size:26px; }
  @keyframes float {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-18px) rotate(8deg); }
  }

  /* main card */
  .card {
    position: relative;
    z-index: 2;
    max-width: 620px;
    width: 100%;
    border: 4px solid var(--yellow);
    padding: 56px 48px 48px;
    background: var(--black);
    animation: pop-in 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes pop-in {
    from { transform: scale(0.7) rotate(-3deg); opacity: 0; }
    to   { transform: scale(1)   rotate(0deg);  opacity: 1; }
  }

  /* corner decorations */
  .card::before, .card::after {
    font-family: 'Bangers', cursive;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--yellow);
    position: absolute;
    opacity: 0.4;
  }
  .card::before { content: '✦ DATAMINDS ✦'; top: 10px; left: 50%; transform: translateX(-50%); white-space: nowrap; }
  .card::after  { content: '✦ DATAMINDS ✦'; bottom: 10px; left: 50%; transform: translateX(-50%); white-space: nowrap; }

  /* big checkmark */
  .check {
    font-size: 80px;
    display: block;
    margin-bottom: 12px;
    animation: spin-in 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.25s both;
    filter: drop-shadow(0 0 16px rgba(0,200,83,0.5));
  }
  @keyframes spin-in {
    from { transform: rotate(-180deg) scale(0); opacity: 0; }
    to   { transform: rotate(0deg)    scale(1); opacity: 1; }
  }

  /* headline */
  h1 {
    font-family: 'Bangers', cursive;
    font-size: clamp(44px, 10vw, 80px);
    letter-spacing: 3px;
    color: var(--yellow);
    text-shadow: 4px 4px 0 var(--blue);
    line-height: 0.95;
    margin-bottom: 24px;
    animation: wobble 4s ease-in-out infinite 0.6s;
  }
  @keyframes wobble {
    0%,100% { transform: rotate(-1deg); }
    50%      { transform: rotate(1deg);  }
  }

  /* message text */
  .message {
    font-family: 'Comic Neue', cursive;
    font-size: clamp(15px, 2.5vw, 18px);
    line-height: 1.75;
    color: rgba(250,250,245,0.85);
    margin-bottom: 36px;
  }
  .message strong {
    font-family: 'Space Mono', monospace;
    font-size: 0.9em;
    color: var(--yellow);
  }

  /* back button */
  .btn {
    font-family: 'Bangers', cursive;
    font-size: 22px;
    letter-spacing: 2px;
    padding: 14px 40px;
    border: 4px solid var(--black);
    text-decoration: none;
    display: inline-block;
    transition: transform 0.1s, box-shadow 0.1s;
    background: var(--yellow);
    color: var(--black);
    cursor: pointer;
  }
  .btn:hover {
    transform: translate(-4px, -4px);
    box-shadow: 8px 8px 0 var(--yellow);
    background: var(--white);
  }

</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="floaty">🗄️</div>
<div class="floaty">💾</div>
<div class="floaty">☕</div>
<div class="floaty">🔧</div>
<div class="floaty">📋</div>
<div class="floaty">🚀</div>

<div class="card">
  <span class="check">✅</span>

  <h1>MESSAGE<br>SENT!</h1>

  <p class="message">
    A DBA will contact you shortly.<br>
    Maybe they're <strong>already looking at your AWR report.</strong><br><br>
    We'll be in touch soon —<br>
    probably before your next full table scan finishes.
  </p>

  <a href="index.html" class="btn">← Back to Home</a>
</div>


</body>
</html>
